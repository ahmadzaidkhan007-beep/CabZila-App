<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CabZila &mdash; Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <script>
        tailwind.config = { theme: { extend: { colors: { gold: '#c9a96e' } } } }
    </script>
    <style>
        body { background: #0a0a0a; color: white; min-height: 100vh; font-family: 'Inter', sans-serif; display: flex; align-items: center; justify-content: center; }
        .glass { background: rgba(255,255,255,0.03); backdrop-filter: blur(16px); border: 1px solid rgba(255,255,255,0.08); box-shadow: 0 20px 40px rgba(0,0,0,0.5); }
        .input-field { width: 100%; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 10px; padding: 14px 16px; color: white; outline: none; transition: border 0.3s; }
        .input-field:focus { border-color: #c9a96e; background: rgba(255,255,255,0.08); }
    </style>
</head>
<body class="p-4 relative">

<!-- Background glow -->
<div class="absolute inset-0 z-[-1] bg-[radial-gradient(ellipse_at_top,_var(--tw-gradient-stops))] from-gold/10 via-[#0a0a0a] to-[#0a0a0a]"></div>

<div class="glass max-w-sm w-full p-8 rounded-3xl">
    <div class="text-center mb-8">
      <span class="w-14 h-14 rounded-2xl mx-auto flex items-center justify-center border bg-gold/10 border-gold/30 mb-5 shadow-[0_0_15px_rgba(201,169,110,0.2)]">
        <i class="fa-solid fa-car-side text-2xl text-gold"></i>
      </span>
        <h1 class="text-3xl font-bold tracking-tight">Welcome back</h1>
        <p class="text-sm text-white/50 mt-2">Sign in to continue to CabZila</p>
    </div>

    <form id="loginForm" class="space-y-5">
        <div>
            <label class="text-xs text-white/50 uppercase tracking-widest mb-1.5 block ml-1">Email</label>
            <input type="email" id="email" class="input-field" placeholder="Enter your email" required>
        </div>
        <div>
            <label class="text-xs text-white/50 uppercase tracking-widest mb-1.5 block ml-1">Password</label>
            <input type="password" id="password" class="input-field" placeholder="Enter your password" required>
        </div>

        <button type="submit" id="loginBtn" class="w-full font-bold py-4 rounded-xl mt-4 transition-all duration-300 hover:-translate-y-1 hover:shadow-[0_10px_20px_-10px_rgba(255,255,255,0.3)]" style="background:#fff; color:#0a0a0a;">
            Sign In
        </button>

        <p class="text-center text-sm text-white/40 mt-6">
            Don't have an account? <a href="register.html" class="text-gold hover:text-white transition-colors">Register now</a>
        </p>
    </form>
</div>

<script>
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
        e.preventDefault();

        const loginBtn = document.getElementById('loginBtn');
        loginBtn.innerText = "Signing in...";
        loginBtn.disabled = true;

        const loginData = {
            email: document.getElementById('email').value,
            password: document.getElementById('password').value
        };

        try {
            // YAHAN APNI LOGIN API KA URL DAALEIN
            const response = await fetch('http://localhost:8080/api/users/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(loginData)
            });

            if (response.ok) {
                const user = await response.json();

                // User ka data browser ki memory me save kar rahe hain taaki baaki pages ko pata rahe kaun login hai
                localStorage.setItem('currentUser', JSON.stringify(user));

                // Role ke hisaab se sahi Dashboard par bhejna
                if (user.role === 'ADMIN') {
                    window.location.href = "admin.html";
                } else if (user.role === 'DRIVER') {
                    window.location.href = "driver.html";
                } else {
                    window.location.href = "index.html"; // Passenger dashboard
                }
            } else {
                const errorMsg = await response.text();
                alert("Login Failed: Incorrect Email or Password");
            }
        } catch (error) {
            console.error("Error:", error);
            alert("Cannot connect to server. Is Spring Boot running?");
        } finally {
            loginBtn.innerText = "Sign In";
            loginBtn.disabled = false;
        }
    });
</script>
</body>
</html>
