<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Site Settings</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .card { max-width: 650px; padding: 20px 25px; border: 1px solid #ddd; border-radius: 8px; }
        label { display: block; margin: 15px 0 5px; font-weight: bold; }
        input[type=text], input[type=email], textarea {
            width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px;
            font-size: 16px; box-sizing: border-box;
        }
        textarea { resize: vertical; min-height: 90px; }
        .hint { font-size: 13px; color: #666; margin-top: 4px; }
        .btn { margin-top: 20px; padding: 10px 24px; border: none; border-radius: 4px;
            background-color: #007bff; color: #fff; font-size: 16px; cursor: pointer; }
        .message { padding: 10px 15px; background: #e8f0fe; border-left: 4px solid #1a73e8; margin-bottom: 15px; }
        .preview { margin-top: 25px; }
        .preview iframe { width: 100%; height: 300px; border: 1px solid #ddd; border-radius: 4px; }
    </style>
</head>
<body>
<div th:replace="~{fragments/admin-header :: adminHeader('settings')}"></div>

<h2>Site Settings</h2>
<a th:href="@{/admin/dashboard}">ADMIN HOME</a><br><br>

<div class="message" th:if="${message}" th:text="${message}"></div>

<div class="card">
    <form th:action="@{/admin/settings}" method="post">

        <label for="contactNumber">Contact Number</label>
        <input type="text" id="contactNumber" name="contactNumber" maxlength="30"
               th:value="${settings.contactNumber}" placeholder="+1800 559 6580" required>

        <label for="email">Email</label>
        <input type="email" id="email" name="email" maxlength="100"
               th:value="${settings.email}" placeholder="info@taxi.com" required>

        <label for="mapIframeUrl">Map Iframe URL</label>
        <textarea id="mapIframeUrl" name="mapIframeUrl" maxlength="1000"
                  th:text="${settings.mapIframeUrl}" required></textarea>
        <div class="hint">Paste only the link from the iframe's <code>src="..."</code> (Google Maps: Share &rarr; Embed a map).</div>

        <button type="submit" class="btn">Save Settings</button>
    </form>
</div>

<div class="preview" th:if="${settings.mapIframeUrl != null and !#strings.isEmpty(settings.mapIframeUrl)}">
    <h3>Map Preview</h3>
    <iframe th:src="${settings.mapIframeUrl}" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>
</div>

</body>
</html>
